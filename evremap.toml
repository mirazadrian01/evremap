#[[remap]]
#input = ["KEY_LEFTCTRL"]
#output = ["KEY_RESERVED"]
#[[remap]]
#input = ["KEY_LEFTCTRL", "KEY_H"]
#output = ["KEY_LEFT"]
#[[remap]]
#input = ["KEY_LEFTCTRL", "KEY_J"]
#output = ["KEY_DOWN"]
#[[remap]]
#input = ["KEY_LEFTCTRL", "KEY_K"]
#output = ["KEY_UP"]
#[[remap]]
#input = ["KEY_LEFTCTRL", "KEY_L"]
#output = ["KEY_RIGHT"]

[[modifier_keys]]
keys = [
    "KEY_FN", 
    "KEY_LEFTALT", 
    "KEY_RIGHTALT", 
    "KEY_LEFTMETA", 
    "KEY_RIGHTMETA", 
    "KEY_LEFTCTRL", 
    "KEY_RIGHTCTRL", 
    "KEY_LEFTSHIFT", 
    "KEY_RIGHTSHIFT", 
    "KEY_CAPSLOCK"
]


# Disable Right Alt for the system
[[remap]]
input = ["KEY_RIGHTALT"]
output = ["KEY_RESERVED"]

# TEMPORAL
[[remap]]
input = ["KEY_BACKSPACE"]
output = ["KEY_MACRO1"]


[[remap]]
input = ["KEY_RIGHTSHIFT"]
output = ["KEY_ENTER"]

# Swap alt and super 
[[remap]]
input = ["KEY_LEFTALT"]
output = ["KEY_LEFTMETA"]
[[remap]]
input = ["KEY_LEFTMETA"]
output = ["KEY_LEFTALT"]

# Caps lock is exit on tap and control on hold
[[dual_role]]
input = "KEY_CAPSLOCK"
hold = ["KEY_LEFTCTRL"]
tap = ["KEY_ESC"]

# Repam \ to backspace
[[remap]]
input = ["KEY_RIGHTBRACE"]
output = ["KEY_BACKSLASH"]

# [ → \
[[remap]]
input = ["KEY_LEFTBRACE"]
output = ["KEY_BACKSPACE"]


# RightAlt + letter → number
[[remap]]
input = ["KEY_RIGHTALT", "KEY_Q"]
output = ["KEY_1"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_W"]
output = ["KEY_2"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_E"]
output = ["KEY_3"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_R"]
output = ["KEY_4"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_T"]
output = ["KEY_5"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_Y"]
output = ["KEY_6"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_U"]
output = ["KEY_7"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_I"]
output = ["KEY_8"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_O"]
output = ["KEY_9"]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_P"]
output = ["KEY_0"]

# RightAlt + Shift + letter → shifted number (symbols)
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_Q"]
output = ["KEY_LEFTSHIFT", "KEY_1"]  # !
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_W"]
output = ["KEY_LEFTSHIFT", "KEY_2"]  # @
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_E"]
output = ["KEY_LEFTSHIFT", "KEY_3"]  # #
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_R"]
output = ["KEY_LEFTSHIFT", "KEY_4"]  # $
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_T"]
output = ["KEY_LEFTSHIFT", "KEY_5"]  # %
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_Y"]
output = ["KEY_LEFTSHIFT", "KEY_6"]  # ^
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_U"]
output = ["KEY_LEFTSHIFT", "KEY_7"]  # &
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_I"]
output = ["KEY_LEFTSHIFT", "KEY_8"]  # *
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_O"]
output = ["KEY_LEFTSHIFT", "KEY_9"]  # (
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_P"]
output = ["KEY_LEFTSHIFT", "KEY_0"]  # )

# Remap RightAlt + f → `
[[remap]]
input = ["KEY_RIGHTALT", "KEY_F"]
output = ["KEY_GRAVE"]

# RightAlt + J → -
[[remap]]
input = ["KEY_RIGHTALT", "KEY_J"]
output = ["KEY_MINUS"]

# RightAlt + Shift + J → _
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_J"]
output = ["KEY_LEFTSHIFT", "KEY_MINUS"]

# RightAlt + K → =
[[remap]]
input = ["KEY_RIGHTALT", "KEY_K"]
output = ["KEY_EQUAL"]

# RightAlt + Shift + K → +
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_K"]
output = ["KEY_LEFTSHIFT", "KEY_EQUAL"]

# RightAlt + L → [
[[remap]]
input = ["KEY_RIGHTALT", "KEY_L"]
output = ["KEY_LEFTBRACE"]

# RightAlt + Shift + L → {
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_L"]
output = ["KEY_LEFTSHIFT", "KEY_LEFTBRACE"]

# RightAlt + ; → ]
[[remap]]
input = ["KEY_RIGHTALT", "KEY_SEMICOLON"]
output = ["KEY_RIGHTBRACE"]

# RightAlt + Shift + ; → }
[[remap]]
input = ["KEY_RIGHTALT", "KEY_LEFTSHIFT", "KEY_SEMICOLON"]
output = ["KEY_LEFTSHIFT", "KEY_RIGHTBRACE"]

# Shift + [ → |
[[remap]]
input = ["KEY_LEFTSHIFT", "KEY_LEFTBRACE"]
output = ["KEY_LEFTSHIFT", "KEY_BACKSLASH"]

# Remap shift + RightAlt + f → ~
[[remap]]
input = ["KEY_LEFTSHIFT", "KEY_RIGHTALT", "KEY_F"]
output = ["KEY_LEFTSHIFT", "KEY_GRAVE"]
